<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHALOM - Rede Social Hebraica</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #0A0E27;
            color: #FFFFFF;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .navbar {
            background: #1A1F3A;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #D4AF37;
        }
        
        .navbar h1 {
            color: #D4AF37;
            font-size: 20px;
        }
        
        .logout-btn {
            background: #D4AF37;
            color: #0A0E27;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .content {
            padding: 20px;
        }
        
        .login-form {
            background: #1A1F3A;
            padding: 30px;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .login-form h2 {
            margin-bottom: 20px;
            color: #D4AF37;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #6B7A99;
        }
        
        .form-group input {
            width: 100%;
            padding: 10px;
            background: #0A0E27;
            border: 1px solid #D4AF37;
            color: #FFFFFF;
            border-radius: 5px;
        }
        
        .btn {
            width: 100%;
            padding: 12px;
            background: #D4AF37;
            color: #0A0E27;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .btn:hover {
            background: #E5C158;
        }
        
        .error {
            background: #8B0000;
            color: #FFF;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        
        .admin-panel {
            background: #1A1F3A;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            border: 2px solid #D4AF37;
        }
        
        .admin-panel h2 {
            color: #D4AF37;
            margin-bottom: 15px;
        }
        
        .home-content {
            background: #1A1F3A;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .user-info {
            background: #0A0E27;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #D4AF37;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="navbar" class="navbar hidden">
        <h1>🕯️ SHALOM</h1>
        <div>
            <span id="userEmail" style="margin-right: 15px; color: #D4AF37;"></span>
            <button class="logout-btn" onclick="logout()">Sair</button>
        </div>
    </div>
    
    <div class="container">
        <!-- LOGIN SCREEN -->
        <div id="loginScreen">
            <div class="login-form">
                <h2>Login - SHALOM</h2>
                <div id="errorMessage" class="error hidden"></div>
                
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="seu@email.com">
                </div>
                
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="loginPassword" placeholder="Sua senha">
                </div>
                
                <button class="btn" onclick="handleLogin()">Entrar</button>
                <button class="btn" style="background: #6B7A99;" onclick="alert('O botão está funcionando!'); showSignup();">Criar Conta</button>
            </div>
        </div>
        
        <!-- SIGNUP SCREEN -->
        <div id="signupScreen" class="hidden">
            <div class="login-form">
                <h2>Criar Conta</h2>
                <div id="signupError" class="error hidden"></div>
                
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signupEmail" placeholder="seu@email.com">
                </div>
                
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="signupPassword" placeholder="Escolha uma senha">
                </div>
                
                <button class="btn" onclick="handleSignup()">Criar Conta</button>
                <button class="btn" style="background: #6B7A99;" onclick="showLogin()">Voltar</button>
            </div>
        </div>
        
        <!-- HOME SCREEN (após login) -->
        <div id="homeScreen" class="hidden">
            <div class="content">
                <div class="user-info">
                    <p><strong>Bem-vindo!</strong></p>
                    <p id="homeEmail"></p>
                </div>
                
                <!-- ADMIN PANEL (só aparece para admin) -->
                <div id="adminPanelContainer" class="hidden">
                    <div class="admin-panel">
                        <h2>🔐 Painel Administrativo</h2>
                        <p style="margin-bottom: 15px; color: #D4AF37;">Você está logado como administrador</p>
                        
                        <div class="form-group">
                            <label>Adicionar Comunidade</label>
                            <input type="text" id="communityName" placeholder="Nome da comunidade">
                        </div>
                        
                        <button class="btn" onclick="addCommunity()">➕ Criar Comunidade</button>
                        
                        <div id="communitiesList" style="margin-top: 20px;"></div>
                    </div>
                </div>
                
                <!-- USER CONTENT (para usuários comuns) -->
                <div id="userContentContainer" class="hidden">
                    <div class="home-content">
                        <h2>📱 Suas Comunidades</h2>
                        <p style="color: #6B7A99; margin-top: 10px;">Em breve você poderá se juntar a comunidades!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import {
        getAuth,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        signOut,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    import {
        getFirestore,
        collection,
        addDoc,
        getDocs,
        query,
        where
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyDNtzaQVr3MeD6UpTbmhe79J_v8bTN-mIA",
        authDomain: "shalom-a1626.firebaseapp.com",
        projectId: "shalom-a1626",
        storageBucket: "shalom-a1626.firebasestorage.app",
        messagingSenderId: "746323382164",
        appId: "1:746323382164:web:1bca1a1df5f5ec6f2b8981",
        measurementId: "G-QXD13ER8SK"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

        const ADMIN_EMAIL = "felucius@gmail.com";

        // Funções Globais
        window.handleLogin = async function() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showError('Por favor preencha todos os campos', 'errorMessage');
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                showError('Email ou senha incorretos', 'errorMessage');
            }
        };

        window.handleSignup = async function() {
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;

            if (!email || !password) {
                showError('Por favor preencha todos os campos', 'signupError');
                return;
            }

            try {
                await createUserWithEmailAndPassword(auth, email, password);
            } catch (error) {
                showError('Erro ao criar conta: ' + error.message, 'signupError');
            }
        };

        window.logout = async function() {
            await signOut(auth);
        };

        window.showLogin = function() {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('signupScreen').classList.add('hidden');
        };

        window.showSignup = function() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('signupScreen').classList.remove('hidden');
        };

        window.addCommunity = async function() {
            const name = document.getElementById('communityName').value;
            if (!name) {
                alert('Digite o nome da comunidade');
                return;
            }

            try {
                await addDoc(collection(db, 'communities'), {
                    name: name,
                    createdBy: auth.currentUser.email,
                    createdAt: new Date(),
                    members: [auth.currentUser.email]
                });
                document.getElementById('communityName').value = '';
                loadCommunities();
            } catch (error) {
                alert('Erro ao criar comunidade: ' + error.message);
            }
        };

        window.loadCommunities = async function() {
            const list = document.getElementById('communitiesList');
            try {
                const q = query(collection(db, 'communities'), where('createdBy', '==', auth.currentUser.email));
                const snapshot = await getDocs(q);
                
                if (snapshot.empty) {
                    list.innerHTML = '<p style="color: #6B7A99; margin-top: 20px;">Nenhuma comunidade criada ainda</p>';
                    return;
                }

                list.innerHTML = '<h3 style="margin-top: 20px; margin-bottom: 10px;">Comunidades Criadas:</h3>';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    list.innerHTML += `<div style="background: #0A0E27; padding: 10px; margin-bottom: 10px; border-radius: 5px; border-left: 3px solid #D4AF37;">
                        <strong>${data.name}</strong><br>
                        <small style="color: #6B7A99;">Membros: ${data.members.length}</small>
                    </div>`;
                });
            } catch (error) {
                console.error('Erro ao carregar comunidades:', error);
            }
        };

        function showError(msg, elementId) {
            const elem = document.getElementById(elementId);
            elem.textContent = msg;
            elem.classList.remove('hidden');
            setTimeout(() => elem.classList.add('hidden'), 3000);
        }

        // Auth State Listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Usuário logado
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('signupScreen').classList.add('hidden');
                document.getElementById('homeScreen').classList.remove('hidden');
                document.getElementById('navbar').classList.remove('hidden');

                document.getElementById('userEmail').textContent = user.email;
                document.getElementById('homeEmail').textContent = `Email: ${user.email}`;

                // Mostrar painel admin se for admin
                if (user.email === ADMIN_EMAIL) {
                    document.getElementById('adminPanelContainer').classList.remove('hidden');
                    document.getElementById('userContentContainer').classList.add('hidden');
                    loadCommunities();
                } else {
                    document.getElementById('adminPanelContainer').classList.add('hidden');
                    document.getElementById('userContentContainer').classList.remove('hidden');
                }
            } else {
                // Usuário deslogado
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('homeScreen').classList.add('hidden');
                document.getElementById('navbar').classList.add('hidden');
                document.getElementById('signupScreen').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
