<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SHALOM</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,Helvetica,sans-serif;
background:#0A0E27;
color:#fff;
min-height:100vh
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

header{
position:sticky;
top:0;
z-index:100;
background:#171C38;
border-bottom:1px solid #D4AF37;
padding:12px 16px;
display:flex;
align-items:center;
justify-content:space-between
}

.logo{
font-size:26px;
font-weight:bold;
color:#D4AF37
}

.header-right{
display:flex;
align-items:center;
gap:8px
}

.header-right button{
background:none;
border:1px solid #59637D;
color:#fff;
border-radius:6px;
padding:7px 10px
}

.container{
max-width:1100px;
margin:auto;
padding:15px
}

.login{
max-width:450px;
margin:70px auto;
background:#171C38;
padding:30px;
border-radius:12px
}

h1,h2,h3{margin-bottom:12px}
h2{color:#D4AF37}

input,textarea,select{
width:100%;
background:#080C20;
border:1px solid #4D5875;
color:#fff;
padding:11px;
border-radius:6px;
margin-top:5px
}

textarea{min-height:100px}

.form-group{margin-bottom:14px}

.btn{
border:0;
border-radius:6px;
padding:11px 15px;
font-weight:bold;
background:#D4AF37;
color:#0A0E27
}

.btn.secondary{
background:#59637D;
color:#fff
}

.btn.danger{
background:#8B0000;
color:#fff
}

.full{
width:100%;
margin-top:8px
}

.error{
background:#8B0000;
padding:10px;
border-radius:6px;
margin-bottom:12px
}

.success{
background:#176B3A;
padding:10px;
border-radius:6px;
margin-bottom:12px
}

.dashboard{
padding-bottom:60px
}

.hero{
margin:10px 0 20px;
background:linear-gradient(135deg,#171C38,#242C50);
border-radius:12px;
padding:25px
}

.hero h1{
color:#D4AF37
}

.menu{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:25px
}

.menu button{
background:#171C38;
color:#fff;
border:1px solid #3D4765;
border-radius:8px;
padding:13px 5px
}

.menu button:hover{
border-color:#D4AF37
}

.section{
margin:25px 0
}

.section-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px
}

.section-head h2{
margin:0
}

.carousel{
display:flex;
gap:12px;
overflow-x:auto;
padding-bottom:10px
}

.carousel::-webkit-scrollbar{
height:5px
}

.item{
min-width:190px;
background:#171C38;
border-radius:9px;
overflow:hidden;
border:1px solid #303956
}

.item img{
width:100%;
height:115px;
object-fit:cover;
background:#303956
}

.item-body{
padding:10px
}

.item-title{
font-weight:bold;
margin-bottom:5px
}

.item-info{
font-size:12px;
color:#AEB7CC
}

.card{
background:#171C38;
padding:18px;
border-radius:10px;
margin-bottom:12px
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px
}

.grid .item{
min-width:0
}

.badge{
display:inline-block;
font-size:11px;
padding:4px 7px;
border-radius:12px;
background:#D4AF37;
color:#0A0E27;
font-weight:bold;
margin:3px 0
}

.badge.free{
background:#218C52;
color:#fff
}

.badge.sub{
background:#5867C9;
color:#fff
}

.badge.buy{
background:#B87820;
color:#fff
}

.actions{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:10px
}

.actions button{
padding:7px 9px;
border-radius:5px;
border:0;
font-weight:bold
}

.page{
background:#171C38;
padding:20px;
border-radius:10px;
margin-top:20px
}

.back{
background:none;
border:1px solid #D4AF37;
color:#D4AF37;
padding:7px 12px;
border-radius:5px;
margin-bottom:15px
}

.search{
display:flex;
gap:8px;
margin-bottom:20px
}

.search input{margin:0}

.community{
background:#080C20;
border-left:3px solid #D4AF37;
padding:14px;
border-radius:6px;
margin-bottom:10px
}

.notification{
padding:12px;
border-bottom:1px solid #303956
}

.profile-avatar{
width:90px;
height:90px;
border-radius:50%;
background:#303956;
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
color:#D4AF37;
margin-bottom:12px
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
z-index:200;
display:flex;
justify-content:center;
align-items:center;
padding:15px
}

.modal-box{
background:#171C38;
width:100%;
max-width:650px;
max-height:90vh;
overflow:auto;
padding:22px;
border-radius:10px
}

.modal-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px
}

.close{
background:none;
border:0;
color:#fff;
font-size:28px
}

.player{
width:100%;
background:#000;
border-radius:8px;
overflow:hidden;
margin:15px 0
}

.player video{
width:100%;
display:block
}

iframe{
width:100%;
height:400px;
border:0
}

.stars{
color:#D4AF37;
font-size:22px;
letter-spacing:3px
}

.cart-row{
display:flex;
justify-content:space-between;
gap:10px;
padding:12px 0;
border-bottom:1px solid #303956
}

.empty{
color:#78839D;
padding:20px 0
}

@media(max-width:700px){
.menu{grid-template-columns:repeat(2,1fr)}
.grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:450px){
.grid{grid-template-columns:1fr}
.email{display:none}
}
</style>
</head>

<body>

<header id="header" class="hidden">
<div class="logo">ש SHALOM</div>

<div class="header-right">
<button onclick="openPage('notifications')">🔔</button>
<button onclick="openPage('profile')">👤</button>
<button onclick="logout()">Sair</button>
</div>
</header>

<main class="container">

<!-- LOGIN -->

<section id="loginScreen">

<div class="login">

<h1>ש SHALOM</h1>
<h2>Entrar</h2>

<div id="loginError" class="error hidden"></div>

<div class="form-group">
<label>Email</label>
<input id="loginEmail" type="email">
</div>

<div class="form-group">
<label>Senha</label>
<input id="loginPassword" type="password">
</div>

<button class="btn full" onclick="login()">Entrar</button>

<button class="btn secondary full" onclick="showSignup()">
Criar Conta
</button>

</div>

</section>

<!-- SIGNUP -->

<section id="signupScreen" class="hidden">

<div class="login">

<h1>ש SHALOM</h1>
<h2>Criar Conta</h2>

<div id="signupError" class="error hidden"></div>

<div class="form-group">
<label>Email</label>
<input id="signupEmail" type="email">
</div>

<div class="form-group">
<label>Senha</label>
<input id="signupPassword" type="password">
</div>

<button class="btn full" onclick="signup()">Criar Conta</button>

<button class="btn secondary full" onclick="showLogin()">
Voltar
</button>

</div>

</section>

<!-- APP -->

<section id="app" class="dashboard hidden">

<div class="hero">

<h1>ש SHALOM</h1>

<p id="welcomeText">
Uma comunidade de conhecimento, cultura e aprendizado.
</p>

<div id="adminMessage" class="badge hidden">
ADMINISTRADOR GERAL
</div>

</div>

<div class="search">

<input
id="searchInput"
placeholder="Pesquisar filmes, livros, séries, artigos..."
onkeyup="searchContent()">

<button class="btn" onclick="searchContent()">🔎</button>

</div>

<nav class="menu">

<button onclick="openPage('home')">🏠 Início</button>
<button onclick="openPage('communities')">👥 Comunidades</button>
<button onclick="openPage('films')">🎬 Filmes</button>
<button onclick="openPage('series')">📺 Séries</button>
<button onclick="openPage('documentaries')">🎞️ Documentários</button>
<button onclick="openPage('articles')">📰 Artigos</button>
<button onclick="openPage('books')">📚 Livros</button>
<button onclick="openPage('studies')">🎓 Estudos</button>
<button onclick="openPage('products')">🛒 Loja</button>
<button onclick="openPage('favorites')">❤️ Favoritos</button>
<button onclick="openPage('history')">🕘 Histórico</button>
<button onclick="openPage('feed')">💬 Feed</button>
<button onclick="openPage('profile')">👤 Perfil</button>
<button onclick="openPage('notifications')">🔔 Notificações</button>
<button onclick="openPage('cart')">🛒 Carrinho</button>

</nav>

<div id="content"></div>

</section>

</main>

<!-- MODAL -->

<div id="modal" class="modal hidden">

<div class="modal-box">

<div class="modal-head">

<h2 id="modalTitle"></h2>

<button class="close" onclick="closeModal()">×</button>

</div>

<div id="modalContent"></div>

</div>

</div>


<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
doc,
getDoc,
deleteDoc,
updateDoc,
query,
where,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig={

apiKey:"AIzaSyDNtzaQVr3MeD6UpTbmhe79J_v8bTN-mIA",

authDomain:"shalom-a1626.firebaseapp.com",

projectId:"shalom-a1626",

storageBucket:"shalom-a1626.firebasestorage.app",

messagingSenderId:"746323382164",

appId:"1:746323382164:web:1bca1a1df5f5ec6f2b8981",

measurementId:"G-QXD13ER8SK"

};


const firebaseApp=initializeApp(firebaseConfig);

const auth=getAuth(firebaseApp);

const db=getFirestore(firebaseApp);


const ADMIN_EMAIL="felucius@gmail.com";

let user=null;
let generalAdmin=false;
let currentPage="home";


const names={

films:"Filmes",
series:"Séries",
documentaries:"Documentários",
articles:"Artigos",
books:"Livros",
studies:"Vídeos de Estudos",
products:"Produtos"

};


window.showSignup=function(){

document.getElementById("loginScreen").classList.add("hidden");

document.getElementById("signupScreen").classList.remove("hidden");

};


window.showLogin=function(){

document.getElementById("signupScreen").classList.add("hidden");

document.getElementById("loginScreen").classList.remove("hidden");

};


window.login=async function(){

const email=document.getElementById("loginEmail").value.trim();

const password=document.getElementById("loginPassword").value;

try{

await signInWithEmailAndPassword(auth,email,password);

}catch(e){

showError("Email ou senha incorretos.","loginError");

}

};


window.signup=async function(){

const email=document.getElementById("signupEmail").value.trim();

const password=document.getElementById("signupPassword").value;

try{

await createUserWithEmailAndPassword(auth,email,password);

}catch(e){

showError(e.message,"signupError");

}

};


window.logout=function(){

signOut(auth);

};


function showError(text,id){

const e=document.getElementById(id);

e.textContent=text;

e.classList.remove("hidden");

setTimeout(()=>e.classList.add("hidden"),5000);

}


onAuthStateChanged(auth,async currentUser=>{

user=currentUser;

if(user){

generalAdmin=user.email.toLowerCase()===ADMIN_EMAIL.toLowerCase();

document.getElementById("loginScreen").classList.add("hidden");

document.getElementById("signupScreen").classList.add("hidden");

document.getElementById("app").classList.remove("hidden");

document.getElementById("header").classList.remove("hidden");

if(generalAdmin){

document.getElementById("adminMessage").classList.remove("hidden");

}

await loadUserProfile();

openPage("home");

}else{

document.getElementById("app").classList.add("hidden");

document.getElementById("header").classList.add("hidden");

document.getElementById("loginScreen").classList.remove("hidden");

}

});


async function loadUserProfile(){

const ref=doc(db,"users",user.uid);

const snap=await getDoc(ref);

if(!snap.exists()){

await updateDoc(ref,{

email:user.email

}).catch(async()=>{

await addDoc(collection(db,"users"),{

uid:user.uid,

email:user.email,

name:user.email.split("@")[0],

bio:"",

createdAt:serverTimestamp()

});

});

}

}


window.openPage=async function(page){

currentPage=page;

const c=document.getElementById("content");

c.innerHTML="";

if(page==="home")return home();

if(page==="communities")return communities();

if(names[page])return contentPage(page);

if(page==="favorites")return favorites();

if(page==="history")return historyPage();

if(page==="profile")return profile();

if(page==="feed")return feed();

if(page==="notifications")return notifications();

if(page==="cart")return cart();

if(page==="search")return searchPage();

};


async function home(){

const c=document.getElementById("content");

c.innerHTML=`

<div class="section">

<div class="section-head">
<h2>🎬 Filmes</h2>
<button class="btn secondary" onclick="openPage('films')">Ver todos</button>
</div>

<div id="homeFilms" class="carousel"></div>

</div>

<div class="section">

<div class="section-head">
<h2>📺 Séries</h2>
<button class="btn secondary" onclick="openPage('series')">Ver todos</button>
</div>

<div id="homeSeries" class="carousel"></div>

</div>

<div class="section">

<div class="section-head">
<h2>🎞️ Documentários</h2>
<button class="btn secondary" onclick="openPage('documentaries')">Ver todos</button>
</div>

<div id="homeDocs" class="carousel"></div>

</div>

<div class="section">

<div class="section-head">
<h2>🎓 Estudos</h2>
<button class="btn secondary" onclick="openPage('studies')">Ver todos</button>
</div>

<div id="homeStudies" class="carousel"></div>

</div>
`;

await carousel("films","homeFilms");
await carousel("series","homeSeries");
await carousel("documentaries","homeDocs");
await carousel("studies","homeStudies");

}


async function carousel(type,target){

const box=document.getElementById(target);

try{

const snap=await getDocs(collection(db,type));

if(snap.empty){

box.innerHTML='<p class="empty">Nenhum conteúdo disponível.</p>';

return;

}

let html="";

snap.forEach(d=>{

const x=d.data();

html+=`

<div class="item">

<img src="${safeImage(x.image)}">

<div class="item-body">

<div class="item-title">
${escape(x.title||x.name||"Sem título")}
</div>

${priceBadge(x)}

<div class="item-info">
${escape(x.description||"")}
</div>

<div class="actions">

<button class="btn" onclick="openContent('${type}','${d.id}')">
Ver
</button>

<button onclick="favorite('${type}','${d.id}')">
❤️
</button>

</div>

</div>
</div>

`;

});

box.innerHTML=html;

}catch(e){

box.innerHTML='<p class="empty">Não foi possível carregar.</p>';

}

}


async function contentPage(type){

const c=document.getElementById("content");

c.innerHTML=`

<div class="page">

<button class="back" onclick="openPage('home')">← Voltar</button>

<div class="section-head">

<h2>${names[type]}</h2>

${generalAdmin && type!=="studies"
?`<button class="btn" onclick="addContent('${type}')">＋ Adicionar</button>`
:""}

</div>

<div id="list" class="grid"></div>

</div>
`;

const list=document.getElementById("list");

const snap=await getDocs(collection(db,type));

if(snap.empty){

list.innerHTML='<p class="empty">Nenhum conteúdo cadastrado.</p>';

return;

}

snap.forEach(d=>{

const x=d.data();

const div=document.createElement("div");

div.className="item";

div.innerHTML=`

<img src="${safeImage(x.image)}">

<div class="item-body">

<div class="item-title">
${escape(x.title||x.name)}
</div>

${priceBadge(x)}

<p class="item-info">
${escape(x.description||"")}
</p>

<div class="actions">

<button class="btn"
onclick="openContent('${type}','${d.id}')">
Abrir
</button>

<button onclick="favorite('${type}','${d.id}')">
❤️
</button>

${generalAdmin
?`<button class="btn danger"
onclick="deleteContent('${type}','${d.id}')">
Excluir
</button>`
:""}

</div>

</div>
`;

list.appendChild(div);

});

}


function priceBadge(x){

if(x.access==="free")
return '<span class="badge free">GRATUITO</span>';

if(x.access==="subscription")
return '<span class="badge sub">ASSINATURA</span>';

if(x.access==="purchase")
return `<span class="badge buy">R$ ${Number(x.price||0).toFixed(2)}</span>`;

return "";

}


window.addContent=function(type){

document.getElementById("modalTitle").textContent=
"Adicionar "+names[type];

document.getElementById("modalContent").innerHTML=`

<div id="modalError" class="error hidden"></div>

<div class="form-group">
<label>Título</label>
<input id="fTitle">
</div>

<div class="form-group">
<label>Imagem/capa (URL)</label>
<input id="fImage" placeholder="https://...">
</div>

<div class="form-group">
<label>Descrição</label>
<textarea id="fDescription"></textarea>
</div>

<div class="form-group">
<label>Tipo de acesso</label>

<select id="fAccess">

<option value="free">Gratuito</option>

<option value="subscription">Assinatura</option>

<option value="purchase">Compra avulsa</option>

</select>

</div>

<div class="form-group">
<label>Preço (se for compra)</label>
<input id="fPrice" type="number" step="0.01">
</div>

<div class="form-group">
<label>URL do vídeo</label>
<input id="fVideo" placeholder="MP4 ou vídeo incorporável">
</div>

<div class="form-group">
<label>URL alternativa</label>
<input id="fUrl" placeholder="https://...">
</div>

<button class="btn full"
onclick="saveContent('${type}')">
Salvar
</button>

`;

document.getElementById("modal").classList.remove("hidden");

};


window.saveContent=async function(type){

try{

await addDoc(collection(db,type),{

title:document.getElementById("fTitle").value,

image:document.getElementById("fImage").value,

description:document.getElementById("fDescription").value,

access:document.getElementById("fAccess").value,

price:Number(document.getElementById("fPrice").value||0),

video:document.getElementById("fVideo").value,

url:document.getElementById("fUrl").value,

createdBy:user.email,

createdAt:serverTimestamp()

});

closeModal();

openPage(type);

}catch(e){

showError(e.message,"modalError");

}

};


window.openContent=async function(type,id){

const snap=await getDoc(doc(db,type,id));

if(!snap.exists())return;

const x=snap.data();

document.getElementById("modalTitle").textContent=x.title;

let media="";

if(x.video){

if(x.video.includes("youtube.com")||x.video.includes("youtu.be")){

let videoId=youtubeId(x.video);

if(videoId){

media=`

<div class="player">

<iframe
src="https://www.youtube.com/embed/${videoId}"
allowfullscreen>
</iframe>

</div>`;

}

}else{

media=`

<div class="player">

<video controls>

<source src="${escapeAttr(x.video)}">

Seu navegador não suporta vídeo.

</video>

</div>`;

}

}else if(x.image){

media=`<img src="${safeImage(x.image)}" style="width:100%;border-radius:8px">`;

}

document.getElementById("modalContent").innerHTML=`

${media}

${priceBadge(x)}

<p style="margin:15px 0">
${escape(x.description||"")}
</p>

${x.access==="free"
?`<button class="btn full" onclick="watch('${type}','${id}')">▶ Assistir</button>`
:""}

${x.access==="subscription"
?`<button class="btn full" onclick="subscriptionMessage()">🔐 Assinar para assistir</button>`
:""}

${x.access==="purchase"
?`<button class="btn full" onclick="buy('${type}','${id}')">🛒 Comprar</button>`
:""}

<button class="btn secondary full"
onclick="favorite('${type}','${id}')">
❤️ Adicionar aos favoritos
</button>

<div class="form-group" style="margin-top:20px">

<label>Avalie este conteúdo</label>

<div class="stars">

<span onclick="rate('${type}','${id}',1)">★</span>
<span onclick="rate('${type}','${id}',2)">★</span>
<span onclick="rate('${type}','${id}',3)">★</span>
<span onclick="rate('${type}','${id}',4)">★</span>
<span onclick="rate('${type}','${id}',5)">★</span>

</div>

</div>

`;

document.getElementById("modal").classList.remove("hidden");

};


window.watch=async function(type,id){

await addDoc(collection(db,"history"),{

uid:user.uid,

type,

contentId:id,

createdAt:serverTimestamp()

});

};


window.favorite=async function(type,id){

try{

const q=query(
collection(db,"favorites"),
where("uid","==",user.uid),
where("type","==",type),
where("contentId","==",id)
);

const snap=await getDocs(q);

if(snap.empty){

await addDoc(collection(db,"favorites"),{

uid:user.uid,
type,
contentId:id,
createdAt:serverTimestamp()

});

alert("Adicionado aos favoritos.");

}else{

alert("Já está nos favoritos.");

}

}catch(e){

alert(e.message);

}

};


window.rate=async function(type,id,rating){

await addDoc(collection(db,"ratings"),{

uid:user.uid,

type,

contentId:id,

rating,

createdAt:serverTimestamp()

});

alert("Avaliação registrada.");

};


window.subscriptionMessage=function(){

alert(
"A área de assinaturas está preparada no aplicativo. " +
"Para cobrar pagamentos reais será necessário conectar um provedor de pagamento."
);

};


window.buy=async function(type,id){

await addDoc(collection(db,"cart"),{

uid:user.uid,

type,

contentId:id,

quantity:1,

createdAt:serverTimestamp()

});

alert("Adicionado ao carrinho.");

function youtubeId(url){

try{

const u=new URL(url);

if(u.hostname.includes("youtu.be"))
return u.pathname.substring(1);

return u.searchParams.get("v");

}catch{

return "";

}

}


function safeImage(url){

if(url&&/^https?:\/\//i.test(url))
return escapeAttr(url);

return "https://via.placeholder.com/600x350/171C38/D4AF37?text=SHALOM";

}


function escape(text){

return String(text||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function escapeAttr(text){

return escape(text);

}
