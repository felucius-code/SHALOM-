/* =====================================================
   AUTENTICAÇÃO
===================================================== */

    align-items: center;

.auth-card {

.logo {

    font-weight: bold;
    color: #172033;
}

.subtitle {

.form-group {

.form-group label {
    display: block;

    margin-bottom: 7px;
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;
    border: 1px solid #d9dfeb;
    border-radius: 9px;
    padding: 12px;

}

.form-group textarea {

}

.form-group input:focus,
.form-group textarea:focus,

    border-color: #5068a0;
}

.btn {

    border-radius: 9px;

    background: #172033;

    font-weight: bold;

.btn:hover {

}

.btn-secondary {

}

    margin-bottom: 18px;

/* =====================================================
   APLICAÇÃO
===================================================== */

#app {
    min-height: 100vh;
}

.navbar {

    align-items: center;

.sidebar {

/* =====================================================
   CARDS / GRID
===================================================== */

.card {
    background: white;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 20px;
    border: 1px solid #e3e7ef;
}

.card-title {
    margin-top: 0;
}

.grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
}

.content-card {
    background: white;
    border-radius: 13px;
    overflow: hidden;
    border: 1px solid #e1e5ed;
}

.content-image {
    width: 100%;
    height: 180px;

}

.content-body {

}

.content-title {

}

.content-description {

}

.content-link {
    display: inline-block;
    margin-top: 12px;
    color: #172033;
    font-weight: bold;
    text-decoration: none;
}

.empty {
    background: white;
    border: 1px dashed #cbd2df;
    border-radius: 12px;
    padding: 30px;
    text-align: center;
    color: #6b7a99;
}

/* =====================================================
   HOME
===================================================== */

.home-section {
    margin-bottom: 35px;
}

.home-section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.home-section-header h2 {
    margin: 0;
}

.home-see-all {
    border: none;
    background: transparent;
    color: #172033;
    font-weight: bold;
}

.home-carousel {
    display: grid;
    grid-template-columns:
        repeat(auto-fill, minmax(190px, 1fr));
    gap: 16px;
}

.home-loading {
    color: #6b7a99;
    padding: 20px 0;
}

/* =====================================================
   COMUNIDADES
===================================================== */

.community-card {
    background: white;
    border: 1px solid #e1e5ed;
    border-radius: 13px;
    padding: 20px;
    margin-bottom: 14px;
}

.community-card h3 {
    margin-top: 0;
}

.community-description {
    color: #6b7a99;
}

.community-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.small-btn {
    padding: 8px 12px;
    border-radius: 7px;
    border: none;
    background: #172033;
    color: white;
}

.small-btn.secondary {
    background: #e8ecf3;
    color: #172033;

/* =====================================================
   RESPONSIVO
===================================================== */

@media (max-width: 800px) {

    .sidebar {

        padding-left: 18px;

}

@media (max-width: 600px) {

    .navbar {

    }

        position: static;

        height: auto;

        border-bottom: 1px solid #e1e5ed;
        margin-top: 64px;
    }

    .main {
        margin-left: 0;
        padding-top: 25px;
    }

    .auth-card {
        padding: 25px;
    }

}

/* =====================================================
   TOAST
===================================================== */

.toast {
    position: fixed;

    bottom: 20px;
    max-width: 350px;
    background: #101a32;
    color: white;
    padding: 14px 18px;
    border-radius: 9px;
    z-index: 5000;

</style>

<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
    getFirestore,
    collection,
    doc,
    getDoc,
    getDocs,
    addDoc,
    setDoc,
    deleteDoc,
    query,
    orderBy,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* =====================================================
   CONFIGURAÇÃO FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDNtzaQVr3MeD6UpTbmhe79J_v8bTN-mIA",

    authDomain:
        "shalom-a1626.firebaseapp.com",

    projectId:
        "shalom-a1626",

    storageBucket:
        "shalom-a1626.firebasestorage.app",

    messagingSenderId:
        "746323382164",

    appId:
        "1:746323382164:web:1bca1a1df5f5ec6f2b8981",

    measurementId:
        "G-QXD13ER8SK"

};


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =====================================================
   ADMINISTRADOR
===================================================== */

/*
   IMPORTANTE:

   A administração não será liberada automaticamente
   para qualquer usuário.

   Para usar a área administrativa, coloque aqui o
   e-mail do administrador da plataforma.

   Não altere mais nada no código.
*/

const ADMIN_EMAIL = "";


/* =====================================================
   ESTADO
===================================================== */

let currentUser = null;

let currentCommunity = null;


/* =====================================================
   FUNÇÕES AUXILIARES
===================================================== */

function $(id) {

    return document.getElementById(id);

}


function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function showToast(message) {

    const toast = $("toast");

    toast.textContent = message;

    toast.classList.remove("hidden");

    setTimeout(() => {

        toast.classList.add("hidden");

    }, 3500);

}


function showError(id, message) {

    const element = $(id);

    if (!element) return;

    element.textContent = message;

    element.classList.remove("hidden");

}


function hideError(id) {

    const element = $(id);

    if (!element) return;

    element.textContent = "";

    element.classList.add("hidden");

}


function firebaseError(error) {

    console.error(error);

    if (!error) {
        return "Ocorreu um erro.";
    }

    switch (error.code) {

        case "auth/invalid-credential":
            return "Email ou senha incorretos.";

        case "auth/invalid-email":
            return "O email informado é inválido.";

        case "auth/email-already-in-use":
            return "Este email já está cadastrado.";

        case "auth/weak-password":
            return "A senha precisa ter pelo menos 6 caracteres.";

        case "auth/user-not-found":
            return "Usuário não encontrado.";

        case "auth/wrong-password":
            return "Senha incorreta.";

        case "auth/network-request-failed":
            return "Falha de conexão com a internet.";

        case "permission-denied":
            return "O Firebase bloqueou esta operação por falta de permissão.";

        default:
            return error.message || "Ocorreu um erro no Firebase.";

    }

}


/* =====================================================
   AUTENTICAÇÃO
===================================================== */

window.showSignup = function() {

    hideError("loginError");

    hideError("signupError");

    $("loginForm").classList.add("hidden");

    $("signupForm").classList.remove("hidden");

};


window.showLogin = function() {

    hideError("loginError");

    hideError("signupError");

    $("signupForm").classList.add("hidden");

    $("loginForm").classList.remove("hidden");

};


window.handleLogin = async function() {

    hideError("loginError");

    const email =
        $("loginEmail").value.trim();

    const password =
        $("loginPassword").value;

    if (!email || !password) {

        showError(
            "loginError",
            "Informe seu email e sua senha."
        );

        return;
    }

    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    } catch (error) {

        showError(
            "loginError",
            firebaseError(error)
        );

    }

};


window.handleSignup = async function() {

    hideError("signupError");

    const email =
        $("signupEmail").value.trim();

    const password =
        $("signupPassword").value;

    if (!email || !password) {

        showError(
            "signupError",
            "Informe email e senha."
        );

        return;
    }

    if (password.length < 6) {

        showError(
            "signupError",
            "A senha precisa ter pelo menos 6 caracteres."
        );

        return;
    }

    try {

        const credential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );

        await setDoc(
            doc(
                db,
                "users",
                credential.user.uid
            ),
            {
                email: email,
                createdAt: serverTimestamp()
            },
            {
                merge: true
            }
        );

    } catch (error) {

        showError(
            "signupError",
            firebaseError(error)
        );

    }

};


window.logout = async function() {

    try {

        await signOut(auth);

    } catch (error) {

        console.error(error);

    }

};


/* =====================================================
   ADMIN
===================================================== */

function isAdmin() {

    if (!currentUser) {
        return false;
    }

    if (
        ADMIN_EMAIL &&
        currentUser.email.toLowerCase()
            === ADMIN_EMAIL.toLowerCase()
    ) {
        return true;
    }

    return false;

}


function updateAdminMenu() {

    const menu = $("adminMenu");

    if (isAdmin()) {

        menu.classList.remove("hidden");

    } else {

        menu.classList.add("hidden");

    }

}


/* =====================================================
   NAVEGAÇÃO
===================================================== */

window.openPage = function(page, button) {

    document
        .querySelectorAll(".nav-item")
        .forEach(item => {

            item.classList.remove("active");

        });

    if (button) {
        button.classList.add("active");
    }

    renderPage(page);

};


window.openPageByName = function(page) {

    document
        .querySelectorAll(".nav-item")
        .forEach(item => {

            item.classList.remove("active");

        });

    document
        .querySelectorAll(".nav-item")
        .forEach(item => {

            const text =
                item.getAttribute("onclick") || "";

            if (
                text.includes("'" + page + "'")
            ) {

                item.classList.add("active");

            }

        });

    renderPage(page);

};


async function renderPage(page) {

    const container = $("pageContent");

    currentCommunity = null;

    switch (page) {

        case "home":
            await renderHome();
            break;

        case "communities":
            await renderCommunities();
            break;

        case "profile":
            renderProfile();
            break;

        case "notifications":
            renderNotifications();
            break;

        case "films":
            await renderContentPage(
                "films",
                "🎬 Filmes",
                "Filmes selecionados pelo SHALOM."
            );
            break;

        case "series":
            await renderContentPage(
                "series",
                "📺 Séries",
                "Séries selecionadas pelo SHALOM."
            );
            break;

        case "books":
            await renderContentPage(
                "books",
                "📚 Livros",
                "Biblioteca do SHALOM."
            );
            break;

        case "articles":
            await renderContentPage(
                "articles",
                "📰 Artigos",
                "Artigos publicados pelo SHALOM."
            );
            break;

        case "documentaries":
            await renderContentPage(
                "documentaries",
                "🎞️ Documentários",
                "Documentários selecionados."
            );
            break;

        case "studies":
            await renderContentPage(
                "studies",
                "📖 Estudos",
                "Estudos publicados no SHALOM."
            );
            break;

        case "videos":
            await renderContentPage(
                "videos",
                "🎥 Vídeos",
                "Vídeos gerais publicados no SHALOM."
            );
            break;

        case "store":
            await renderContentPage(
                "products",
                "🛒 Loja",
                "Produtos disponíveis no SHALOM."
            );
            break;

        case "admin":

            if (!isAdmin()) {

                container.innerHTML = `
                    <div class="card">
                        <h2>Acesso restrito</h2>
                        <p>
                            Esta área é exclusiva do
                            administrador geral.
                        </p>
                    </div>
                `;

                return;
            }

            await renderAdmin();
            break;

        default:
            await renderHome();

    }

}


/* =====================================================
   HOME
===================================================== */

async function renderHome() {

    $("pageContent").innerHTML = `

        <div class="home-header">

            <h1 class="page-title">
                ש SHALOM
            </h1>

            <p class="page-description">
                Conteúdo selecionado para você.
            </p>

        </div>

        <section class="home-section">

            <div class="home-section-header">

                <h2>
                    ⭐ Destaques
                </h2>

            </div>

            <div
                id="homeFeatured"
                class="home-carousel"
            >
                <div class="home-loading">
                    Carregando...
                </div>
            </div>

        </section>

        ${homeSection(
            "films",
            "🎬 Filmes",
            "homeFilms"
        )}

        ${homeSection(
            "series",
            "📺 Séries",
            "homeSeries"
        )}

async function loadHomeCategory(
    collectionName,
    elementId
) {

    const element =
        $(elementId);

    if (!element) {
        return;
    }

    try {

        const snapshot =
            await getDocs(
                collection(
                    db,
                    collectionName
                )
            );

        const items =
            snapshot.docs
                .slice(0, 8)
                .map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));

        if (!items.length) {

            element.innerHTML = `
                <div class="empty">
                    Nenhum conteúdo disponível.
                </div>
            `;

            return;
        }

        element.innerHTML =
            items
                .map(item =>
                    contentCard(
                        item,
                        collectionName
                    )
                )
                .join("");

    } catch (error) {

        console.error(
            "Erro carregando",
            collectionName,
            error
        );

        element.innerHTML = `
            <div class="empty">
                Não foi possível carregar
                este conteúdo.
            </div>
        `;

    }

}


async function loadFeatured() {

    const element =
        $("homeFeatured");

    if (!element) {
        return;
    }

    const collections = [
        "films",
        "series",
        "books",
        "documentaries"
    ];

    let items = [];

    try {

        for (
            const collectionName
            of collections
        ) {

            const snapshot =
                await getDocs(
                    collection(
                        db,
                        collectionName
                    )
                );

            snapshot.docs
                .slice(0, 2)
                .forEach(item => {

                    items.push({
                        id: item.id,
                        ...item.data(),
                        category:
                            collectionName
                    });

                });

        }

        items =
            items.slice(0, 8);

        if (!items.length) {

            element.innerHTML = `
                <div class="empty">
                    Nenhum destaque disponível.
                </div>
            `;

            return;
        }

        element.innerHTML =
            items
                .map(item =>
                    contentCard(
                        item,
                        item.category
                    )
                )
                .join("");

    } catch (error) {

        console.error(
            "Erro nos destaques:",
            error
        );

        element.innerHTML = `
            <div class="empty">
                Nenhum destaque disponível.
            </div>
        `;

    }

}

window.saveContent =
async function(
    collectionName,
    id
) {

    if (!isAdmin()) {

        showToast(
            "Você não tem permissão."
        );

        return;
    }

    const title =
        $("contentTitle").value.trim();

    const description =
        $("contentDescription").value.trim();

    const imageUrl =
        $("contentImage").value.trim();

    const url =
        $("contentUrl").value.trim();

    if (!title) {

        showToast(
            "Informe o título."
        );

        return;
    }

    try {

        const data = {

            title,
            description,
            imageUrl,
            url,
            updatedAt:
                serverTimestamp()

        };

        if (id) {

            await setDoc(
                doc(
                    db,
                    collectionName,
                    id
                ),
                data,
                {
                    merge: true
                }
            );

        } else {

            await addDoc(
                collection(
                    db,
                    collectionName
                ),
                {
                    ...data,
                    createdAt:
                        serverTimestamp()
                }
            );

        }

        const overlay =
            $("contentFormOverlay");

        if (overlay) {
            overlay.remove();
        }

        showToast(
            "Conteúdo salvo."
        );

        await renderContentPage(
            collectionName,
            getCollectionTitle(
                collectionName
            ),
            getCollectionDescription(
                collectionName
            )
        );

    } catch (error) {

        showToast(
            firebaseError(error)
        );

    }

};

window.editContent =
async function(
    collectionName,
    id
) {

    if (!isAdmin()) {
        return;
    }

    try {

        const snapshot =
            await getDoc(
                doc(
                    db,
                    collectionName,
                    id
                )
            );

        if (!snapshot.exists()) {

            showToast(
                "Conteúdo não encontrado."
            );

            return;
        }

        const data =
            snapshot.data();

        showContentForm(
            collectionName,
            id
        );

        setTimeout(() => {

            $("contentTitle").value =
                data.title ||
                data.name ||
                "";

            $("contentDescription").value =
                data.description ||
                "";

            $("contentImage").value =
                data.imageUrl ||
                data.image ||
                "";

            $("contentUrl").value =
                data.url ||
                data.link ||
                "";

        }, 50);

    } catch (error) {

        showToast(
            firebaseError(error)
        );

    }

};

        $("studyVideoTitle")
            .value
            .trim();

    const description =
        $("studyVideoDescription")
            .value
            .trim();

    const url =
        $("studyVideoUrl")
            .value
            .trim();

    if (!title || !url) {

        showToast(
            "Informe o título e o link."
        );

        return;
    }

    try {

        await addDoc(
            collection(
                db,
                "communityStudyVideos"
            ),
            {
                communityId:
                    currentCommunity.id,

                title,
                description,
                url,

                createdAt:
                    serverTimestamp(),

                createdBy:
                    currentUser.uid

            }
        );

        $("studyVideoTitle").value = "";

        $("studyVideoDescription").value = "";

        $("studyVideoUrl").value = "";

        hideStudyVideoForm();

        showToast(
            "Vídeo salvo."
        );

        await loadCommunityVideos();

    } catch (error) {

        showToast(
            firebaseError(error)
        );

    }

};


async function loadCommunityVideos() {

    const container =
        $("communityStudyVideos");

    if (
        !container ||
        !currentCommunity
    ) {
        return;
    }

    try {

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "communityStudyVideos"
                )
            );

        const videos =
            snapshot.docs
                .map(item => ({
                    id: item.id,
                    ...item.data()
                }))
                .filter(
                    item =>
                        item.communityId
                        === currentCommunity.id
                );

        if (!videos.length) {

            container.innerHTML = `

                <div class="empty">
                    Nenhum vídeo de estudo
                    publicado nesta comunidade.
                </div>

            `;

            return;
        }

        container.innerHTML =
            videos
                .map(video => `

                    <div class="card">

                        <h3>
                            ${escapeHtml(
                                video.title
                            )}
                        </h3>

                        <p
                            style="color:#6B7A99;"
                        >
                            ${escapeHtml(
                                video.description ||
                                ""
                            )}
                        </p>

                        <a
                            class="content-link"
                            href="${escapeHtml(
                                video.url
                            )}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Assistir →
                        </a>

                    </div>

                `)
                .join("");

    } catch (error) {

        container.innerHTML = `

            <div class="empty">
                Não foi possível carregar
                os vídeos.
            </div>

        `;

    }

}

async function loadAdminCommunities() {

    const select =
        $("adminCommunitySelect");

    if (!select) {
        return;
    }

    try {

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "communities"
                )
            );

        select.innerHTML = `

            <option value="">
                Selecione uma comunidade
            </option>

        `;

        snapshot.docs
            .forEach(item => {

                const data =
                    item.data();

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    item.id;

                option.textContent =
                    data.name ||
                    "Comunidade";

                select.appendChild(
                    option
                );

            });

        await loadCommunityAdmins();

    } catch (error) {

        console.error(error);

    }

}


window.assignCommunityAdmin =
async function() {

    if (!isAdmin()) {
        return;
    }

    const communityId =
        $("adminCommunitySelect")
            .value;

    const email =
        $("communityAdminEmail")
            .value
            .trim();

    if (!communityId) {

        showToast(
            "Selecione uma comunidade."
        );

        return;
    }

    if (!email) {

        showToast(
            "Informe o email."
        );

        return;
    }

    try {

        await addDoc(
            collection(
                db,
                "communityAdmins"
            ),
            {
                communityId,
                email,
                createdAt:
                    serverTimestamp(),
                createdBy:
                    currentUser.uid
            }
        );

        $("communityAdminEmail")
            .value = "";

        showToast(
            "Administrador definido."
        );

        await loadCommunityAdmins();

    } catch (error) {

        showToast(
            firebaseError(error)
        );

    }

};


async function loadCommunityAdmins() {

    const container =
        $("communityAdminsList");

    if (!container) {
        return;
    }

    try {

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "communityAdmins"
                )
            );

        if (snapshot.empty) {

            container.innerHTML = `

                <p style="color:#6B7A99;">
                    Nenhum administrador de comunidade
                    cadastrado.
                </p>

            `;

            return;
        }

        container.innerHTML =
            snapshot.docs
                .map(item => {

                    const data =
                        item.data();

                    return `

                        <div
                            style="
                                padding:12px;
                                border-bottom:
                                    1px solid #e5e8ef;
                            "
                        >

                            <strong>
                                ${escapeHtml(
                                    data.email
                                )}
                            </strong>

                            <div
                                style="
                                    color:#6B7A99;
                                    font-size:13px;
                                "
                            >
                                Comunidade:
                                ${escapeHtml(
                                    data.communityId
                                )}
                            </div>

                        </div>

                    `;

                })
                .join("");

    } catch (error) {

        console.error(error);

    }

}


/* =====================================================
   ESTADO DE AUTENTICAÇÃO
===================================================== */

onAuthStateChanged(
    auth,
    async user => {

        currentUser = user;

        if (user) {

            $("authScreen")
                .classList
                .add("hidden");

            $("app")
                .classList
                .remove("hidden");

            $("userEmail")
                .textContent =
                user.email || "";

            updateAdminMenu();

            try {

                await setDoc(
                    doc(
                        db,
                        "users",
                        user.uid
                    ),
                    {
                        email:
                            user.email || "",
                        lastLogin:
                            serverTimestamp()
                    },
                    {
                        merge: true
                    }
                );

            } catch (error) {

                /*
                    Não interromper o aplicativo
                    se as regras do Firestore ainda
                    não permitirem gravar usuários.
                */

                console.warn(
                    "Não foi possível atualizar usuário:",
                    error
                );

            }

            await renderPage("home");

        } else {

            $("app")
                .classList
                .add("hidden");

            $("authScreen")
                .classList
                .remove("hidden");

            showLogin();

        }

    }
);

</script>
